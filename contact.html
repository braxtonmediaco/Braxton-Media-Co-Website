        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Montserrat', 'sans-serif'] },
                    colors: {
                        brand: { blue: '#2A2EE5', gray: '#4F4F51', dark: '#121212' }

    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #4F4F51; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #2A2EE5; }

        .fade-in { animation: fadeIn 0.8s ease-out forwards; opacity: 0; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .nav-link.active { color: #2A2EE5; position: relative; }
        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #2A2EE5;
            box-shadow: 0 0 10px #2A2EE5;
            transition: all 0.3s ease;
        }

        .glass {
            background: rgba(30, 30, 30, 0.4);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(79, 79, 81, 0.3);
        }
        .glass:hover {
            background: rgba(42, 46, 229, 0.1);
            border: 1px solid rgba(42, 46, 229, 0.5);
            box-shadow: 0 0 30px rgba(42, 46, 229, 0.2);
        }

        @media (prefers-reduced-motion: reduce) {
            .fade-in { animation: none; opacity: 1; }
            * { scroll-behavior: auto !important; }
        }
    </style>
</head>

    <div class="hidden md:block fixed bottom-8 right-8 z-40">

    <main id="main-content" class="pt-24 grow relative z-10">
        
        <section class="py-20 min-h-[80vh]">
            <div class="max-w-4xl mx-auto px-4 fade-in">
                <div class="text-center mb-12">
                    <h1 class="text-4xl md:text-6xl font-black text-white mb-4">Let's Create Together</h1>
                    <p class="text-slate-400 text-lg font-medium">Ready to book? Fill out the form below or email us directly.</p>
                </div>

                <div class="glass rounded-3xl p-10 md:p-12 shadow-2xl">
                    <form action="https://formspree.io/f/mdaaajzl" method="POST" class="space-y-6">
                        <div class="flex flex-col group">
                            <label for="contact-name" class="block text-sm font-bold text-slate-300 mb-2 group-focus-within:text-brand-blue transition-colors">Your Name</label>
                            <input type="text" id="contact-name" name="name" autocomplete="name" required class="w-full bg-brand-gray/10 border border-brand-gray/30 rounded-xl px-5 py-4 text-white focus:outline-none focus:border-brand-blue focus:ring-2 focus:ring-brand-blue/50 focus:bg-brand-gray/20 transition-all font-medium" placeholder="John Doe">
                        </div>
                        <div class="flex flex-col group">
                            <label for="contact-email" class="block text-sm font-bold text-slate-300 mb-2 group-focus-within:text-brand-blue transition-colors">Your Email</label>
                            <input type="email" id="contact-email" name="email" autocomplete="email" required class="w-full bg-brand-gray/10 border border-brand-gray/30 rounded-xl px-5 py-4 text-white focus:outline-none focus:border-brand-blue focus:ring-2 focus:ring-brand-blue/50 focus:bg-brand-gray/20 transition-all font-medium" placeholder="john@example.com">
                        </div>
                        <div class="flex flex-col group">
                            <label for="contact-message" class="block text-sm font-bold text-slate-300 mb-2 group-focus-within:text-brand-blue transition-colors">Your Message</label>
                            <textarea id="contact-message" name="message" required rows="5" class="w-full bg-brand-gray/10 border border-brand-gray/30 rounded-xl px-5 py-4 text-white focus:outline-none focus:border-brand-blue focus:ring-2 focus:ring-brand-blue/50 focus:bg-brand-gray/20 transition-all font-medium" placeholder="Tell us about your project…"></textarea>
                        </div>
                        <button type="submit" class="w-full bg-brand-blue text-white font-black text-lg py-4 mt-4 rounded-xl hover:bg-white hover:text-brand-blue hover:shadow-[0_0_30px_rgba(42,46,229,0.4)] transition-all duration-300 transform hover:scale-[1.01] focus:outline-none focus-visible:ring-2 focus-visible:ring-white">Send Message</button>
                    </form>
                    
                    <div class="mt-12 flex flex-col md:flex-row justify-center gap-10 text-center border-t border-brand-gray/30 pt-10">
                        <a href="mailto:brax.warr@gmail.com" class="flex items-center justify-center text-slate-400 hover:text-white transition-colors font-medium">
                            <i aria-hidden="true" data-lucide="mail" class="w-5 h-5 mr-3 text-brand-blue"></i>
                            brax.warr@gmail.com
                        </a>
                        <a href="tel:+13082162441" class="flex items-center justify-center text-slate-400 hover:text-white transition-colors font-medium">
                            <i aria-hidden="true" data-lucide="phone" class="w-5 h-5 mr-3 text-brand-blue"></i>
                            (308) 216-2441
                        </a>
                    </div>
                </div>
            </div>
        </section>

    </main>
